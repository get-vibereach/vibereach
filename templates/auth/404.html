{% extends 'auth/base_auth.html' %}
{% load static %}

{% block title %}Page Not Found{% endblock %} 

{% block content %}
<body class="min-h-screen bg-base-100">

    <!-- Consistent Header from your Auth Pages -->
    <header class="absolute top-0 left-0 w-full flex justify-between items-center p-4 pt-2">
        <span class="badge badge-primary badge-outline font-semibold">Beta</span> 
        <a href="{% url 'home' %}" class="btn btn-ghost btn-circle">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
        </a>
    </header>

    <main class="min-h-screen flex flex-col items-center justify-center p-4 text-center">
        
        <!-- Consistent Logo -->
        <div class="flex items-center mb-8">
            <img src="{% static 'vibereach-logo.png' %}" alt="Logo" class="w-12">
            <span class="ml-3 text-3xl font-bold gradient-logo">VibeReach</span>
        </div>

        <!-- 404 Content Card -->
        <div class="card w-full max-w-md shrink-0 shadow-lg bg-base-100">
            <div class="card-body items-center text-center p-10">
                
                <!-- Large 404 Number, using your primary theme color -->
                <h1 class="text-9xl font-bold text-primary">404</h1>
                
                <!-- Main Message -->
                <h2 class="text-3xl font-bold text-base-content mt-4">Page Not Found</h2>
                
                <!-- Helper Text -->
                <p class="text-base-content/70 mt-2">
                    Oops! The page you are looking for doesn't exist or may have been moved.
                </p>

                <!-- Action Button to guide the user home -->
                <div class="card-actions mt-6">
                    <a href="{% url 'home' %}" class="btn btn-primary-safe">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                           <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                        Go to Homepage
                    </a>
                </div>

            </div>
        </div>
    </main>

    <!-- Make sure the gradient style is available on this page too -->
    <style>
    .gradient-logo {
      background: linear-gradient(90deg,rgba(82, 32, 3, 1) 0%, rgba(153, 109, 8, 1) 35%, rgba(255, 64, 0, 1) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    </style>

</body>
{% endblock %}
