{% extends 'auth/base_auth.html' %}
{% load static %}

{% block title %}Reset Password{% endblock %} 

{% block content %}
<body class="min-h-screen bg-base-100">
    <!-- Messages -->
    {% if messages %}
        {% for message in messages %}
            <div class="toast toast-top toast-center z-50 msg-dj">
                <div 
                class="alert 
                        {% if message.tags == 'success' %}alert-success
                        {% elif message.tags == 'warning' %}alert-warning
                        {% elif message.tags == 'error' %}alert-error
                        {% else %}alert-info{% endif %}
                mb-4">
                <span>{{ message }}</span>
                </div>
            </div>    
        {% endfor %}
    {% endif %}


    <!-- Header: Correctly positioned with flexbox -->
    <header class="absolute top-0 left-0 w-full flex justify-between items-center p-4 pt-2">
        <span class="badge badge-primary badge-outline font-semibold">Beta</span> 
        <a href="{% url 'home' %}" class="btn btn-ghost">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
        </a>
    </header>

    <main class="min-h-screen flex flex-col items-center justify-center p-4">
        
        <!-- Logo -->
        <div class="flex items-center mb-6">
            <img src="/static/vibereach-logo.png" alt="Logo" class="w-12">
            <span class="ml-3 text-3xl font-bold gradient-logo">VibeReach</span>
        </div>

        <!-- Reset Password Card -->
        <div class="card w-full max-w-sm shrink-0 shadow-lg bg-base-100">
            <form class="card-body" method="post" action="{% url 'reset_password' %}">
                {% csrf_token %}
                <h2 class="card-title text-2xl font-bold justify-start mb-4">Set Your Password</h2>

                <!-- New Password Input -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">New Password</span>
                    </label>
                    <input type="password" name="new_password" placeholder="" class="input input-bordered" required />
                </div>

                <!-- Confirm New Password Input -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Confirm New Password</span>
                    </label>
                    <input type="password" name="confirm_password" placeholder="" class="input input-bordered" required />
                </div>

                <!-- Set Password Button -->
                <div class="form-control mt-6">
                     <button type="submit" class="btn btn-primary w-full">
                        Set Password
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
{% endblock %}
