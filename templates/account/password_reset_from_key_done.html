{% extends 'auth/base_auth.html' %}
{% load static %}
{% load i18n %}

{% block title %}{% trans "Password Reset" %}{% endblock %}

{% block content %}
<body class="min-h-screen bg-base-100">
    <main class="min-h-screen flex flex-col items-center justify-center p-4">
        
        <!-- Logo -->
        <div class="flex items-center mb-6">
            <img src="/static/vibereach-logo.png" alt="Logo" class="w-12">
            <span class="ml-3 text-3xl font-bold gradient-logo">VibeReach</span>
        </div>

        <!-- Card -->
        <div class="card w-full max-w-sm shrink-0 shadow-lg bg-base-100">
            <div class="card-body">
                <h2 class="card-title text-2xl font-bold justify-start mb-4">{% trans "Password Reset" %}</h2>

                <p>{% trans "Your password has been reset." %}</p>

                <div class="form-control mt-6">
                     <a href="{% url 'account_login' %}" class="btn btn-primary w-full">
                        Login
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
{% endblock %}
