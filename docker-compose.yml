services:
  web_blue:
    build: .
    ports:
      - "8010:8000"
    env_file:
      - .env.blue
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "mkdir -p /app/logs &&
             python manage.py collectstatic --noinput &&
             python manage.py makemigrations &&
             python manage.py makemigrations clients campaign api support feedback &&
             python manage.py migrate clients &&
             python manage.py migrate campaign &&
             python manage.py migrate support &&
             python manage.py migrate feedback &&
             python manage.py migrate &&
             gunicorn dcrm.wsgi:application --bind 0.0.0.0:8000 --access-logfile /app/logs/gunicorn_access.log --error-logfile /app/logs/gunicorn_error.log"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - ./logs_blue:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy  # Wait for Redis to be healthy
    networks:
      - app-network
      - redis-network

  web_green:
    build: .
    ports:
      - "8011:8000"
    env_file:
      - .env.green
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "mkdir -p /app/logs &&
             python manage.py collectstatic --noinput &&
             python manage.py makemigrations &&
             python manage.py makemigrations clients campaign api support feedback &&
             python manage.py migrate clients &&
             python manage.py migrate campaign &&
             python manage.py migrate support &&
             python manage.py migrate feedback &&
             python manage.py migrate &&
             gunicorn dcrm.wsgi:application --bind 0.0.0.0:8000 --access-logfile /app/logs/gunicorn_access.log --error-logfile /app/logs/gunicorn_error.log"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - ./logs_green:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy  # Wait for Redis to be healthy
    networks:
      - app-network
      - redis-network

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: vibereach-db-1
      POSTGRES_USER: omar
      POSTGRES_PASSWORD: uW9_qX9_pT8-yG4_zU1_
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omar -d vibereach-db-1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - redis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  static_volume:
  pgdata:
  redis_data:

networks:
  app-network:
    driver: bridge
  redis-network:
    driver: bridge
