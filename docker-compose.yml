version: "3.8"

services:
  vibereach_backend:
    build: .
    ports:
      - "8001:8000" # Use standard port, or let Dokploy manage it
    restart: unless-stopped
    env_file:
      - .env # Single environment file
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "mkdir -p /app/logs &&
            python manage.py generate_jwt_keys &&
            python manage.py collectstatic --noinput &&
            python manage.py makemigrations &&
            python manage.py makemigrations clients campaign api support feedback &&
            python manage.py migrate clients &&
            python manage.py migrate campaign &&
            python manage.py migrate support &&
            python manage.py migrate feedback &&
            python manage.py migrate &&
            gunicorn dcrm.wsgi:application --bind 0.0.0.0:8000 --access-logfile /app/logs/gunicorn_access.log --error-logfile /app/logs/gunicorn_error.log"]
    volumes:
      - static_volume:/app/staticfiles
      # Add media volume if needed
      # - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - app-network

volumes:
  static_volume:
  redis_data:
  # media_volume:  # Uncomment if needed

networks:
  app-network:
    driver: bridge
