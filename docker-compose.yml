version: "3.8"

services:
  vibereach_backend:
    build: .
    ports:
      - "8001:8000" # Use standard port, or let Dokploy manage it
    restart: unless-stopped
    env_file:
      - .env # Single environment file
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn dcrm.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_volume:/app/staticfiles
      # Add media volume if needed
      # - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: vibereach-db-1
      POSTGRES_USER: omar
      POSTGRES_PASSWORD: uW9_qX9_pT8-yG4_zU1_
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omar -d vibereach-db-1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - app-network

volumes:
  static_volume:
  postgres_data:
  redis_data:
  # media_volume:  # Uncomment if needed

networks:
  app-network:
    driver: bridge
